services:
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
      target: development
    container_name: 5kplatform_api_dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/5kplatform?schema=public
    ports:
      - "4000:4000"
    volumes:
      # Hot reload — apenas o código fonte!
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/.sequelizerc:/app/.sequelizerc
      - ./backend/src/migrations:/app/src/migrations
      - ./backend/src/seeders:/app/src/seeders
      # (Removido) Não montar volume anônimo em /app/node_modules — isso escondia as dependências instaladas no build
    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - 5kplatform_network
    entrypoint: ["/usr/local/bin/docker-entrypoint-dev.sh"]
    command: npm run dev

  postgres:
    image: postgres:16-alpine
    container_name: 5kplatform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: 5kplatform
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - 5kplatform_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: 5kplatform_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    networks:
      - 5kplatform_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  5kplatform_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
